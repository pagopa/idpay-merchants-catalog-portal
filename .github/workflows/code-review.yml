name: 'coverage'

on:
  push:
    branches:
      - main
      - uat
      - develop
  pull_request:
    types:
      - opened
      - edited
      - synchronize

jobs:
  sonarcloud:
    runs-on: ubuntu-24.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: |
          corepack enable
          yarn install --immutable --check-cache || yarn install --force 

      - name: Test and coverage
        run: yarn test:coverage

      - name: SonarCloud Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          npm install --global sonar-scanner
          sonar-scanner \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.token=${SONAR_TOKEN} \
            -Dsonar.organization=${{ vars.SONARCLOUD_ORG }} \
            -Dsonar.projectKey=${{ vars.SONARCLOUD_PROJECT_KEY }} \
            -Dsonar.projectName="${{ vars.SONARCLOUD_PROJECT_NAME }}" \
            -Dsonar.javascript.lcov.reportPaths=./coverage/lcov.info \
            -Dsonar.exclusions=**/__mocks__/**,**/*.js,**/*.cjs,**/src/assets/**,**/src/config/**,**/jest.setup.ts,**/jest.config.ts \
            -Dsonar.test.inclusions=**/__tests__/** \
            -Dsonar.typescript.tsconfigPath=tsconfig.json